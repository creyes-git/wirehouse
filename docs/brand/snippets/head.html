<!-- Wirehouse — favicons, manifest and link previews. Copy the favicon/ files to your site root. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#070B16">

<!-- Open Graph / Twitter — replace [YOUR-DOMAIN] -->
<meta property="og:type" content="website">
<meta property="og:title" content="Wirehouse">
<meta property="og:description" content="Walk through your codebase like a warehouse.">
<meta property="og:image" content="https://[YOUR-DOMAIN]/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://[YOUR-DOMAIN]/og-image-1200x630.png">
